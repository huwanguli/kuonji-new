# Kuonji Blog 生产部署编排
#
# 设计：
#   - 服务器上不存放源码：镜像在本机构建后 docker save/load 传输。
#   - 复用服务器已有 mysql / redis 容器（不在此栈内启动），通过 config.yaml 连接。
#   - config.yaml 与 uploads 目录外挂（bind mount），便于维护与迁移旧附件。
#   - backend 不发布主机端口，仅内网；frontend(Caddy) 对外暴露 80/443。
#   - 容器名使用 kuonji-new-* 前缀，避免与旧微服务容器重名，方便回滚。
#
# 服务器目录布局（/root/kuonji-deploy）：
#   docker-compose.yml
#   config/config.yaml        <- 本仓库 docker/config/config.yaml
#   uploads/                  <- 旧博客附件复制至此

services:
  backend:
    image: ghcr.io/huwanguli/kuonji-new/kuonji-backend:latest
    container_name: kuonji-new-backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./uploads:/app/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/articles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ghcr.io/huwanguli/kuonji-new/kuonji-frontend:latest
    container_name: kuonji-new-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
